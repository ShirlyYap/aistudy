<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星际躲避 - 小游戏</title>
  <style>
    /* ========== 页面基础样式 ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* 深色太空背景，居中显示游戏 */
      background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #fff;
      overflow: hidden;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
      letter-spacing: 4px;
    }

    /* 游戏画布容器 */
    #gameContainer {
      position: relative;
      border: 3px solid #4a9eff;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(74, 158, 255, 0.3),
                  inset 0 0 60px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      background: #050510;
      border-radius: 5px;
    }

    /* 底部操作提示 */
    .hint {
      margin-top: 15px;
      font-size: 14px;
      color: #8899bb;
      text-align: center;
      line-height: 1.8;
    }

    .hint kbd {
      background: #2a3a5e;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #4a6a9e;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <h1>⭐ 星际躲避 ⭐</h1>

  <div id="gameContainer">
    <!-- 游戏主画布，所有图形都在这里绘制 -->
    <canvas id="gameCanvas" width="480" height="640"></canvas>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 移动飞船 &nbsp;|&nbsp;
    躲避红色陨石，收集黄色星星 &nbsp;|&nbsp;
    <kbd>空格</kbd> 重新开始
  </div>

  <script>
    // ============================================================
    //  星际躲避 - 完整游戏逻辑
    //  机制：键盘控制、碰撞检测、分数统计、游戏结束判定
    // ============================================================

    // ---------- 获取画布和绘图上下文 ----------
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;   // 画布宽度
    const H = canvas.height;  // 画布高度

    // ---------- 游戏状态常量 ----------
    const STATE = {
      START: "start",       // 开始界面
      PLAYING: "playing",   // 游戏中
      GAMEOVER: "gameover"  // 游戏结束
    };

    // ---------- 全局游戏变量 ----------
    let gameState = STATE.START;  // 当前游戏状态
    let score = 0;                // 当前分数
    let highScore = 0;            // 历史最高分（保存在 localStorage）
    let frameCount = 0;           // 帧计数器，用于控制难度递增
    let difficulty = 1;           // 难度等级

    // 键盘按键状态（按下为 true，松开为 false）
    const keys = {
      ArrowLeft: false,
      ArrowRight: false,
      KeyA: false,
      KeyD: false,
      Space: false
    };

    // ---------- 玩家飞船对象 ----------
    const player = {
      x: W / 2,           // 中心 x 坐标
      y: H - 60,          // 固定在底部附近
      width: 40,          // 碰撞盒宽度
      height: 30,         // 碰撞盒高度
      speed: 6,           // 移动速度（像素/帧）
      color: "#4aefef"    // 飞船颜色
    };

    // ---------- 游戏对象数组 ----------
    let asteroids = [];   // 陨石（障碍物）列表
    let stars = [];       // 星星（加分道具）列表
    let particles = [];   // 粒子特效列表
    let bgStars = [];     // 背景装饰星星

    // ---------- 从 localStorage 读取最高分 ----------
    try {
      highScore = parseInt(localStorage.getItem("starDodgeHighScore")) || 0;
    } catch (e) {
      highScore = 0;
    }

    // ============================================================
    //  初始化背景星星（装饰用，不参与碰撞）
    // ============================================================
    function initBgStars() {
      bgStars = [];
      for (let i = 0; i < 80; i++) {
        bgStars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          size: Math.random() * 2 + 0.5,
          speed: Math.random() * 1.5 + 0.3,
          brightness: Math.random()
        });
      }
    }

    // ============================================================
    //  重置游戏（开始新一局）
    // ============================================================
    function resetGame() {
      score = 0;
      frameCount = 0;
      difficulty = 1;
      asteroids = [];
      stars = [];
      particles = [];
      player.x = W / 2;
      initBgStars();
    }

    // ============================================================
    //  生成陨石（从顶部随机位置落下）
    // ============================================================
    function spawnAsteroid() {
      const size = Math.random() * 20 + 15;  // 半径 15~35
      asteroids.push({
        x: Math.random() * (W - size * 2) + size,
        y: -size,
        radius: size,
        speed: Math.random() * 2 + 2 + difficulty * 0.3,  // 速度随难度增加
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.08,
        vertices: generateAsteroidShape(size)  // 随机多边形顶点
      });
    }

    // 生成陨石的不规则多边形顶点（让每颗陨石形状不同）
    function generateAsteroidShape(radius) {
      const verts = [];
      const numVerts = Math.floor(Math.random() * 4) + 6;  // 6~9 个顶点
      for (let i = 0; i < numVerts; i++) {
        const angle = (i / numVerts) * Math.PI * 2;
        const r = radius * (0.7 + Math.random() * 0.3);  // 半径随机波动
        verts.push({
          ox: Math.cos(angle) * r,
          oy: Math.sin(angle) * r
        });
      }
      return verts;
    }

    // ============================================================
    //  生成星星（加分道具，从顶部落下，速度较慢）
    // ============================================================
    function spawnStar() {
      stars.push({
        x: Math.random() * (W - 40) + 20,
        y: -20,
        radius: 12,
        speed: Math.random() * 1.5 + 1.5,
        pulse: Math.random() * Math.PI * 2  // 闪烁动画相位
      });
    }

    // ============================================================
    //  生成粒子特效（收集星星或碰撞时触发）
    // ============================================================
    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,           // 生命值 1→0，用于淡出
          decay: Math.random() * 0.03 + 0.02,
          size: Math.random() * 4 + 2,
          color: color
        });
      }
    }

    // ============================================================
    //  碰撞检测：矩形 vs 圆形
    //  player 是矩形，target 是圆形（陨石/星星）
    // ============================================================
    function rectCircleCollision(rect, circle) {
      // 找到矩形上距离圆心最近的点
      const closestX = Math.max(rect.x - rect.width / 2,
                        Math.min(circle.x, rect.x + rect.width / 2));
      const closestY = Math.max(rect.y - rect.height / 2,
                        Math.min(circle.y, rect.y + rect.height / 2));
      // 计算最近点到圆心的距离
      const distX = circle.x - closestX;
      const distY = circle.y - closestY;
      const distSq = distX * distX + distY * distY;
      // 距离小于半径则碰撞
      return distSq < circle.radius * circle.radius;
    }

    // ============================================================
    //  绘制函数
    // ============================================================

    // 绘制背景（渐变 + 装饰星星）
    function drawBackground() {
      // 深空渐变背景
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, "#0a0a2e");
      grad.addColorStop(1, "#050510");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // 绘制缓慢下移的背景星星
      for (const s of bgStars) {
        ctx.globalAlpha = 0.3 + s.brightness * 0.7;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 绘制玩家飞船（三角形 + 引擎火焰）
    function drawPlayer() {
      const px = player.x;
      const py = player.y;

      ctx.save();
      ctx.translate(px, py);

      // --- 引擎火焰（随机闪烁） ---
      const flameHeight = 8 + Math.random() * 6;
      ctx.fillStyle = "#ff6633";
      ctx.beginPath();
      ctx.moveTo(-6, player.height / 2);
      ctx.lineTo(0, player.height / 2 + flameHeight);
      ctx.lineTo(6, player.height / 2);
      ctx.fill();

      ctx.fillStyle = "#ffaa33";
      ctx.beginPath();
      ctx.moveTo(-3, player.height / 2);
      ctx.lineTo(0, player.height / 2 + flameHeight * 0.6);
      ctx.lineTo(3, player.height / 2);
      ctx.fill();

      // --- 飞船主体（三角形） ---
      ctx.fillStyle = player.color;
      ctx.strokeStyle = "#2abbbb";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -player.height / 2);          // 顶部尖角
      ctx.lineTo(-player.width / 2, player.height / 2);  // 左下
      ctx.lineTo(player.width / 2, player.height / 2);   // 右下
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // --- 驾驶舱（小圆） ---
      ctx.fillStyle = "#aaffff";
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 绘制陨石（不规则多边形，带旋转）
    function drawAsteroid(ast) {
      ctx.save();
      ctx.translate(ast.x, ast.y);
      ctx.rotate(ast.rotation);

      // 陨石主体
      ctx.fillStyle = "#cc4444";
      ctx.strokeStyle = "#882222";
      ctx.lineWidth = 2;
      ctx.beginPath();
      const v = ast.vertices;
      ctx.moveTo(v[0].ox, v[0].oy);
      for (let i = 1; i < v.length; i++) {
        ctx.lineTo(v[i].ox, v[i].oy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 陨石表面纹理（几个小圆点）
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(v[i].ox * 0.5, v[i].oy * 0.5, ast.radius * 0.15, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // 绘制可收集的星星（五角星，带脉冲闪烁）
    function drawCollectStar(star) {
      const pulse = 1 + Math.sin(star.pulse) * 0.15;
      const r = star.radius * pulse;

      ctx.save();
      ctx.translate(star.x, star.y);

      // 光晕
      ctx.fillStyle = "rgba(255, 220, 50, 0.2)";
      ctx.beginPath();
      ctx.arc(0, 0, r * 2, 0, Math.PI * 2);
      ctx.fill();

      // 五角星
      ctx.fillStyle = "#ffdd44";
      ctx.strokeStyle = "#ccaa00";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const method = i === 0 ? "moveTo" : "lineTo";
        ctx[method](Math.cos(angle) * r, Math.sin(angle) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    // 绘制粒子特效
    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 绘制 HUD（分数、难度等信息）
    function drawHUD() {
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 18px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("分数: " + score, 15, 30);

      ctx.textAlign = "right";
      ctx.fillText("最高: " + highScore, W - 15, 30);

      ctx.textAlign = "center";
      ctx.font = "14px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillStyle = "#8899bb";
      ctx.fillText("难度 Lv." + difficulty, W / 2, 30);
    }

    // 绘制开始界面
    function drawStartScreen() {
      // 半透明遮罩
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = "center";

      // 标题
      ctx.fillStyle = "#4aefef";
      ctx.font = "bold 36px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillText("星际躲避", W / 2, H / 2 - 80);

      // 副标题
      ctx.fillStyle = "#ffdd44";
      ctx.font = "18px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillText("躲避陨石 · 收集星星", W / 2, H / 2 - 40);

      // 操作说明
      ctx.fillStyle = "#cccccc";
      ctx.font = "16px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillText("← → 或 A D 键移动飞船", W / 2, H / 2 + 10);
      ctx.fillText("碰到红色陨石 = 游戏结束", W / 2, H / 2 + 40);
      ctx.fillText("收集黄色星星 = +10 分", W / 2, H / 2 + 70);

      // 闪烁的"按空格开始"提示
      if (Math.floor(frameCount / 30) % 2 === 0) {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px 'Segoe UI', 'Microsoft YaHei', sans-serif";
        ctx.fillText("按 空格键 开始游戏", W / 2, H / 2 + 130);
      }

      // 显示最高分
      if (highScore > 0) {
        ctx.fillStyle = "#8899bb";
        ctx.font = "14px 'Segoe UI', 'Microsoft YaHei', sans-serif";
        ctx.fillText("最高分: " + highScore, W / 2, H / 2 + 170);
      }
    }

    // 绘制游戏结束界面
    function drawGameOverScreen() {
      // 半透明红色遮罩
      ctx.fillStyle = "rgba(80, 0, 0, 0.6)";
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = "center";

      // "游戏结束"标题
      ctx.fillStyle = "#ff4444";
      ctx.font = "bold 40px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillText("游戏结束", W / 2, H / 2 - 60);

      // 本局得分
      ctx.fillStyle = "#ffffff";
      ctx.font = "24px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillText("得分: " + score, W / 2, H / 2 - 10);

      // 是否破纪录
      if (score >= highScore && score > 0) {
        ctx.fillStyle = "#ffdd44";
        ctx.font = "18px 'Segoe UI', 'Microsoft YaHei', sans-serif";
        ctx.fillText("🎉 新纪录！", W / 2, H / 2 + 25);
      } else {
        ctx.fillStyle = "#8899bb";
        ctx.font = "16px 'Segoe UI', 'Microsoft YaHei', sans-serif";
        ctx.fillText("最高分: " + highScore, W / 2, H / 2 + 25);
      }

      // 重新开始提示
      if (Math.floor(frameCount / 30) % 2 === 0) {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px 'Segoe UI', 'Microsoft YaHei', sans-serif";
        ctx.fillText("按 空格键 重新开始", W / 2, H / 2 + 80);
      }
    }

    // ============================================================
    //  游戏逻辑更新（每帧调用）
    // ============================================================
    function update() {
      frameCount++;

      // ---------- 背景星星缓慢下移 ----------
      for (const s of bgStars) {
        s.y += s.speed;
        if (s.y > H) {
          s.y = 0;
          s.x = Math.random() * W;
        }
      }

      // 非游戏进行中时，仅更新 frameCount 用于闪烁动画
      if (gameState !== STATE.PLAYING) return;

      // ---------- 玩家移动（根据按键状态） ----------
      if (keys.ArrowLeft || keys.KeyA) {
        player.x -= player.speed;
      }
      if (keys.ArrowRight || keys.KeyD) {
        player.x += player.speed;
      }
      // 限制玩家在画布范围内
      player.x = Math.max(player.width / 2,
                  Math.min(W - player.width / 2, player.x));

      // ---------- 难度递增（每 600 帧提升一级） ----------
      const newDifficulty = Math.floor(frameCount / 600) + 1;
      if (newDifficulty > difficulty) {
        difficulty = newDifficulty;
      }

      // ---------- 生成陨石（间隔随难度缩短） ----------
      const asteroidInterval = Math.max(30, 80 - difficulty * 8);
      if (frameCount % asteroidInterval === 0) {
        spawnAsteroid();
      }

      // ---------- 生成星星（固定间隔） ----------
      if (frameCount % 120 === 0) {
        spawnStar();
      }

      // ---------- 更新陨石位置 & 碰撞检测 ----------
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const ast = asteroids[i];
        ast.y += ast.speed;
        ast.rotation += ast.rotSpeed;

        // 陨石与玩家碰撞 → 游戏结束
        if (rectCircleCollision(player, ast)) {
          spawnParticles(player.x, player.y, "#ff4444", 20);
          gameState = STATE.GAMEOVER;
          // 更新最高分
          if (score > highScore) {
            highScore = score;
            try {
              localStorage.setItem("starDodgeHighScore", highScore);
            } catch (e) { /* 忽略存储失败 */ }
          }
          return;
        }

        // 移除超出屏幕底部的陨石
        if (ast.y - ast.radius > H) {
          asteroids.splice(i, 1);
          score += 1;  // 成功躲避 +1 分
        }
      }

      // ---------- 更新星星位置 & 收集检测 ----------
      for (let i = stars.length - 1; i >= 0; i--) {
        const star = stars[i];
        star.y += star.speed;
        star.pulse += 0.08;

        // 玩家收集星星 → 加分 + 粒子特效
        if (rectCircleCollision(player, star)) {
          score += 10;
          spawnParticles(star.x, star.y, "#ffdd44", 12);
          stars.splice(i, 1);
          continue;
        }

        // 移除超出屏幕的星星
        if (star.y - star.radius > H) {
          stars.splice(i, 1);
        }
      }

      // ---------- 更新粒子特效 ----------
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    // ============================================================
    //  渲染（每帧调用）
    // ============================================================
    function render() {
      drawBackground();

      // 绘制所有游戏对象
      for (const ast of asteroids) drawAsteroid(ast);
      for (const star of stars) drawCollectStar(star);
      drawParticles();

      // 游戏进行中或结束时不显示开始界面，但要显示飞船
      if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
        drawPlayer();
      }

      // 游戏中显示 HUD
      if (gameState === STATE.PLAYING) {
        drawHUD();
      }

      // 覆盖层界面
      if (gameState === STATE.START) {
        drawStartScreen();
      } else if (gameState === STATE.GAMEOVER) {
        drawHUD();
        drawGameOverScreen();
      }
    }

    // ============================================================
    //  主游戏循环（requestAnimationFrame）
    // ============================================================
    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    // ============================================================
    //  键盘事件监听
    // ============================================================

    // 按键按下
    document.addEventListener("keydown", function (e) {
      // 阻止方向键和空格键滚动页面
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) {
        e.preventDefault();
      }

      if (e.code in keys) {
        keys[e.code] = true;
      }

      // 空格键：开始游戏 / 重新开始
      if (e.code === "Space") {
        if (gameState === STATE.START) {
          resetGame();
          gameState = STATE.PLAYING;
        } else if (gameState === STATE.GAMEOVER) {
          resetGame();
          gameState = STATE.PLAYING;
        }
      }
    });

    // 按键松开
    document.addEventListener("keyup", function (e) {
      if (e.code in keys) {
        keys[e.code] = false;
      }
    });

    // ============================================================
    //  启动游戏
    // ============================================================
    initBgStars();
    gameLoop();

  </script>
</body>
</html>
